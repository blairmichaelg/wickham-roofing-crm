[project]
name = "wickham-roofing-crm"
version = "2.3.8"
description = "Local CRM and automated estimating engine."
authors = [{name = "Wickham Roofing LLC"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "google-genai>=1.0.0",
    "reportlab>=4.0.0",
    "pdfplumber>=0.11.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "Pillow>=10.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "no_mock_ownership: marks tests that bypass field rep ownership mocking",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient.*",
    "ignore::DeprecationWarning:fastapi.testclient.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*"
]

[tool.mypy]
python_version = "3.11"
strict = false

# Strict type-checking for the pure domain and service layers
[[tool.mypy.overrides]]
module = [
    "app.core.status_labels",
    "app.core.utils",
    "app.core.complexity",
    "app.core.job_costing",
    "app.services.supplement_engine",
    "app.services.supplement_models",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true

# Phase 1 of an incremental strict rollout
[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "app.services.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# Third-party stubs that are intentionally missing — suppress noise
[[tool.mypy.overrides]]
module = [
    "arq.*",
    "pdfplumber.*",
    "reportlab.*",
    "structlog.*",
    "google.*",
    "PIL.*",
    "passlib.*",
]
ignore_missing_imports = true


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E701", "E402", "F401"]

[tool.coverage.run]
source = ["app"]
omit = ["app/templates/*", "app/static/*"]

[tool.coverage.report]
# Target thresholds — enforced in CI
fail_under = 75
show_missing = true

[tool.coverage.paths]
source = ["app"]
